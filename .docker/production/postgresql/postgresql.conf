# PostgreSQL Production Configuration
# Sized for the docker-compose.prod.yml container limit (memory: 3G, cpus: 3) — host 8C/16G.
# اگر limit کانتینر را بالا بردی، این سه مقدار را هم متناسب کن:
#   shared_buffers ≈ 25% RAM · effective_cache_size ≈ 65% RAM · maintenance_work_mem ≈ 8% RAM

# ------------------------------
# CONNECTION SETTINGS
# ------------------------------
listen_addresses = '*'
port = 5432
# Octane workers (persistent) + Horizon + scheduler + reverb + headroom
max_connections = 120
superuser_reserved_connections = 3

# ------------------------------
# MEMORY SETTINGS
# ------------------------------
# shared_buffers: ~25% of the CONTAINER limit (3G * 0.25 = 768MB)
shared_buffers = 768MB

# effective_cache_size: ~65% of the container limit (planner hint, no allocation)
effective_cache_size = 2GB

# work_mem: per-sort/join. Active connections are few (Octane workers + Horizon ~20)
work_mem = 8MB

# maintenance_work_mem: VACUUM/CREATE INDEX — must fit alongside shared_buffers in 2G
maintenance_work_mem = 256MB

# ------------------------------
# WAL SETTINGS (Write-Ahead Logging)
# ------------------------------
wal_level = replica
wal_buffers = 16MB
min_wal_size = 512MB
max_wal_size = 2GB

# Checkpoint settings (for write performance)
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
checkpoint_warning = 30s

# ------------------------------
# QUERY PLANNER
# ------------------------------
# Cost estimation
random_page_cost = 1.1  # For SSD (default 4.0 for HDD)
seq_page_cost = 1.0
effective_io_concurrency = 200  # For SSD

# Parallel query settings
# cpus limit = 3
max_worker_processes = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2
max_parallel_workers = 6

# ------------------------------
# AUTOVACUUM TUNING
# ------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# Aggressive vacuum for high-write workloads
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05

# Cost-based vacuum delay
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 1000

# ------------------------------
# LOGGING
# ------------------------------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# What to log
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '
log_timezone = 'UTC'

# Log slow queries (adjust based on your needs)
log_min_duration_statement = 1000  # Log queries > 1 second
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0

# ------------------------------
# STATEMENT STATISTICS
# ------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# ------------------------------
# CLIENT CONNECTION DEFAULTS
# ------------------------------
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'

# ------------------------------
# LOCK MANAGEMENT
# ------------------------------
deadlock_timeout = 1s
max_locks_per_transaction = 64

# ------------------------------
# BACKGROUND WRITER
# ------------------------------
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

# ------------------------------
# REPLICATION (if needed)
# ------------------------------
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on

# ------------------------------
# PERFORMANCE OPTIMIZATIONS
# ------------------------------
# Reduce context switching
huge_pages = try

# Optimize for OLTP workloads
synchronous_commit = on
wal_compression = on
wal_writer_delay = 200ms

# Table statistics
default_statistics_target = 100

# JIT compilation (PostgreSQL 11+)
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000
