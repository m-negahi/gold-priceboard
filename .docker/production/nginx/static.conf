# HamrahGold — static asset server (behind Traefik).
# Faghat masirhaye static; har chiz e dige 404 (hich PHP/source i serve nemishavad).
# Cache-Control header-ha ra Traefik middleware ha mizanand (build-cache/static-cache).
server {
    listen 80;
    server_name _;
    root /srv/public;

    sendfile on;
    tcp_nopush on;
    etag on;
    access_log off;

    location = /healthz { return 200 "ok"; }

    location /build/   { try_files $uri =404; }
    location /images/  { try_files $uri =404; }
    location /fonts/   { try_files $uri =404; }
    # storage jodagane mount mishavad (nested mount dakhel e volume e ro momken nist)
    location /storage/ { alias /srv/storage-public/; try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; }

    location / { return 404; }
}
